# Para Dokploy (tipo "Compose") o para probar con: docker compose up -d
# El dominio y HTTPS los pones en Dokploy → Domains (puerto del contenedor: 3000).
services:
  inventario:
    image: ghcr.io/robertdanielpineda1-ux/toma_inventario:latest
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      SESSION_DAYS: ${SESSION_DAYS:-30}
    volumes:
      - inventario-data:/data
    expose:
      - "3000"

volumes:
  inventario-data:
